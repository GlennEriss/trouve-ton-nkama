# =============================================================================
# Workflow de Tests CI/CD - apps/location-maison
# =============================================================================
# Ce workflow exécute les tests unitaires, d'intégration et E2E
# lors des push/PR sur les branches main et develop, uniquement quand
# apps/location-maison change.
# =============================================================================

name: location-maison Tests & Quality

on:
  push:
    branches: [main, develop]
    paths: ['apps/location-maison/**']
  pull_request:
    branches: [main, develop]
    paths: ['apps/location-maison/**']

# Annuler les runs précédents sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  COVERAGE_THRESHOLD: 70

defaults:
  run:
    working-directory: apps/location-maison

jobs:
  # =============================================================================
  # LINT & TYPE CHECK
  # =============================================================================
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/location-maison/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔎 TypeScript check
        run: npx tsc --noEmit

      - name: 🧹 ESLint
        run: npm run lint

  # =============================================================================
  # TESTS UNITAIRES
  # =============================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/location-maison/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm run test:unit -- --coverage --coverageReporters=json-summary --coverageReporters=lcov
        env:
          CI: true

      - name: 📊 Upload unit coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/location-maison/coverage/lcov.info
          flags: unit
          name: unit-coverage
          fail_ci_if_error: false

      - name: 💾 Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: apps/location-maison/coverage/
          retention-days: 7

  # =============================================================================
  # TESTS D'INTÉGRATION
  # =============================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/location-maison/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔗 Run integration tests
        run: npm run test:integration -- --coverage --coverageReporters=json-summary
        env:
          CI: true

      - name: 📊 Upload integration coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/location-maison/coverage/lcov.info
          flags: integration
          name: integration-coverage
          fail_ci_if_error: false

  # =============================================================================
  # TESTS E2E (End-to-End) avec Playwright
  # =============================================================================
  e2e-tests:
    name: 🌐 E2E Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    # Désactivé par défaut jusqu'à ce que Playwright soit configuré
    if: false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/location-maison/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps

      - name: 🔨 Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: 🌐 Run E2E tests
        run: npm run test:e2e

      - name: 📤 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/location-maison/playwright-report/
          retention-days: 30

  # =============================================================================
  # RAPPORT DE COUVERTURE
  # =============================================================================
  coverage-report:
    name: 📈 Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always() && needs.unit-tests.result == 'success'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: apps/location-maison/coverage/

      - name: 📊 Display coverage summary
        run: |
          echo "## 📊 Rapport de Couverture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
            STATEMENTS=$(cat coverage/coverage-summary.json | jq '.total.statements.pct')
            FUNCTIONS=$(cat coverage/coverage-summary.json | jq '.total.functions.pct')
            BRANCHES=$(cat coverage/coverage-summary.json | jq '.total.branches.pct')

            echo "| Métrique | Couverture | Objectif | Statut |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|------------|----------|--------|" >> $GITHUB_STEP_SUMMARY

            if (( $(echo "$LINES >= ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "| Lines | ${LINES}% | ${{ env.COVERAGE_THRESHOLD }}% | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Lines | ${LINES}% | ${{ env.COVERAGE_THRESHOLD }}% | ❌ |" >> $GITHUB_STEP_SUMMARY
            fi

            if (( $(echo "$STATEMENTS >= ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "| Statements | ${STATEMENTS}% | ${{ env.COVERAGE_THRESHOLD }}% | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Statements | ${STATEMENTS}% | ${{ env.COVERAGE_THRESHOLD }}% | ❌ |" >> $GITHUB_STEP_SUMMARY
            fi

            if (( $(echo "$FUNCTIONS >= ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "| Functions | ${FUNCTIONS}% | ${{ env.COVERAGE_THRESHOLD }}% | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Functions | ${FUNCTIONS}% | ${{ env.COVERAGE_THRESHOLD }}% | ❌ |" >> $GITHUB_STEP_SUMMARY
            fi

            if (( $(echo "$BRANCHES >= ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "| Branches | ${BRANCHES}% | ${{ env.COVERAGE_THRESHOLD }}% | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Branches | ${BRANCHES}% | ${{ env.COVERAGE_THRESHOLD }}% | ❌ |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Fichier de couverture non trouvé" >> $GITHUB_STEP_SUMMARY
          fi

      - name: ✅ Check coverage threshold
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')

            if (( $(echo "$LINES < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "❌ La couverture de code est inférieure au seuil requis de ${{ env.COVERAGE_THRESHOLD }}%"
              echo "   Couverture actuelle: ${LINES}%"
              # Pour l'instant, on ne fait pas échouer le build
              # exit 1
            else
              echo "✅ La couverture de code est suffisante: ${LINES}%"
            fi
          fi

  # =============================================================================
  # RÉSUMÉ FINAL
  # =============================================================================
  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, coverage-report]
    if: always()

    steps:
      - name: 📋 Generate summary
        run: |
          echo "## 📋 Résumé des Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Code Quality | ${{ needs.quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || (needs.integration-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Coverage Report | ${{ needs.coverage-report.result == 'success' && '✅ Generated' || '⚠️ Issue' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Généré automatiquement par GitHub Actions*" >> $GITHUB_STEP_SUMMARY
