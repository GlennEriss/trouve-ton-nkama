name: location-maison-admin CI

on:
  pull_request:
    paths: ['apps/location-maison-admin/**']
  push:
    branches:
      - main
    paths: ['apps/location-maison-admin/**']

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/location-maison-admin

      - name: Build
        run: npm run build --workspace=apps/location-maison-admin
