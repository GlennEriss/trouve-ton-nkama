    - "Parking"
    - "Wi-Fi"
    - "Sécurisé"
    - "Vélo"
    - "Activités sportives"
    - "Adapté aux enfants"
    - "Accessible handicapés"
    - "Étudiant"
    - "Calme et tranquillité"
    - "Proche de la plage"

files:
  input: "../../axesso/property.json"
  output: "transformed_properties.json"
  stats: "key_usage_stats.json"
  progress: "progress_state.json"

logging:
  level: "info"  # debug, info, warn, error
  save_stats: true
  show_detailed_progress: true 