limits:
  rate_limit_per_key: 50  # Limite par clé par jour
  request_delay: 2000     # Délai entre les requêtes en ms
  retry_delay: 3000       # Délai avant retry en cas d'erreur
  max_retries: 8          # Nombre max de tentatives (une par clé)

