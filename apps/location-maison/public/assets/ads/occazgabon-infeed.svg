    <text x="0" y="124" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">Achetez malin.</text>
    <text x="0" y="174" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#D5E7E3">Mode, maison, téléphones, beauté et objets d'occasion au Gabon.</text>

