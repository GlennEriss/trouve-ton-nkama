      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0A2928" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A2928" flood-opacity="0.12"/>
