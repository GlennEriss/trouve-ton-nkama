      <text x="28" y="35" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#073D3B">Créer un compte</text>
      <text x="274" y="34" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">occaz-gabon.vercel.app</text>
    </g>
