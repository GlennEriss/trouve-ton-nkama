<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Publicite occazGabon</title>
  <desc id="desc">Campagne occazGabon pour creer un compte vendeur et acheter des articles d'occasion au Gabon.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="132%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A2928" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#0A2928" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="#EEF4F2"/>
  <rect x="34" y="34" width="1132" height="332" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>
  <path d="M64 34 H646 V366 H64 C47.431 366 34 352.569 34 336 V64 C34 47.431 47.431 34 64 34 Z" fill="#073D3B"/>
  <path d="M646 34 H1136 C1152.569 34 1166 47.431 1166 64 V336 C1166 352.569 1152.569 366 1136 366 H646 Z" fill="#FAFBF8"/>
  <path d="M646 34 L710 34 L646 366 Z" fill="#0B5954" opacity="0.16"/>

  <g transform="translate(78 70)">
    <rect x="0" y="0" width="74" height="44" rx="14" fill="#FFFFFF"/>
    <text x="18" y="29" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#073D3B">OG</text>
    <text x="94" y="30" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">occazGabon</text>

    <text x="0" y="104" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">Vendez sur occazGabon</text>
    <text x="0" y="158" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">plus vite au Gabon</text>
    <text x="0" y="204" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#CFE2DE">Publiez gratuitement vêtements, meubles, téléphones</text>
    <text x="0" y="232" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#CFE2DE">et bonnes affaires. Les acheteurs vous trouvent.</text>

    <g transform="translate(0 260)">
